# =======================================================
# ShopSense Database Configuration
# =======================================================

# Database mode: 'auto' (try MySQL first, fallback to embedded), 'mysql', or 'embedded'
db.mode=auto

# MySQL Configuration (MySQL 8.x / 9.x)
mysql.driver=com.mysql.cj.jdbc.Driver
mysql.url=jdbc:mysql://localhost:3306/shopsense?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
mysql.user=root
mysql.password=root

# Embedded H2 Database Configuration (MySQL Compatibility Mode)
h2.driver=org.h2.Driver
h2.url=jdbc:h2:./data/shopsense;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
h2.user=sa
h2.password=

# Server Configuration
server.port=8080
